name: Objava stranice

on:
  push:
    branches: [main]
  schedule:
    # svake noći oko 3:17 po hrvatskom vremenu (02:17 UTC zimi)
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  izgradnja:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 22
      - name: Složi nove križaljke
        if: github.event_name != 'push'
        env:
          MINUTA: '25'
        run: node klasicna/nocna.js 12
      - name: Spremi nove križaljke u repozitorij
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stranica/data
          if git diff --cached --quiet; then echo "Nema novih križaljki."; exit 0; fi
          git commit -m "Nove križaljke $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: stranica

  objava:
    needs: izgradnja
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
